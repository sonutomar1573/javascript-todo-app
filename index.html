<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8"><meta name="viewport" content="width=device-width, initial-scale=1.0">
<meta name="description" content="A simple task manager to organize your daily tasks.">
<title>TaskFlow — To-do App</title><link rel="stylesheet" href="styles.css">
</head>
<body>
<main class="app">
<header class="header"><div><p class="eyebrow">YOUR DAILY SPACE</p><h1>Task<span>Flow</span></h1><p class="sub">Make today count, one task at a time.</p></div><div class="date" id="today"></div></header>
<section class="add-panel" aria-label="Add a task"><form id="task-form"><label class="sr-only" for="task-input">New task</label><input id="task-input" type="text" placeholder="What needs to get done?" maxlength="120" required><button type="submit" aria-label="Add task">＋</button></form></section>
<section class="toolbar"><div class="filters" role="group" aria-label="Filter tasks"><button class="filter active" data-filter="all">All</button><button class="filter" data-filter="active">Active</button><button class="filter" data-filter="completed">Completed</button></div><button id="clear-completed" class="clear">Clear completed</button></section>
<section aria-live="polite" aria-label="Task list"><ul id="task-list" class="task-list"></ul><div id="empty" class="empty"><div class="empty-icon">✦</div><h2>You're all caught up</h2><p>Add a task above to get started.</p></div></section>
<footer class="footer"><span id="task-count">0 tasks left</span><span>Saved automatically</span></footer>
</main><script src="script.js"></script>
</body></html>
